components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide JWT access token as `Bearer <token>` in the Authorization header.
    FrappeTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Frappe API key and secret of a user holding Grievance Dashboard Reader, sent as `token
        <api_key>:<api_secret>`. Generated on that user in the desk and checked by the platform; the gateway
        passes the header through.
    GatewayKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: 'The gateway key issued to the IVR platform, sent as `apikey: <key>`. The gateway checks
        it, removes it, and calls Frappe as the Grievance Submitter user with that user''s own API key
        and secret, which the platform never holds.'
  schemas:
    ApiMeta:
      type: object
      properties:
        api_version:
          type: string
          example: v1
          description: Semantic API version
        status:
          type: string
          example: current
          description: Lifecycle status
      required:
      - api_version
    StandardErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
          enum:
          - error
        message:
          type: string
          description: Human-readable error description
        exception:
          type: string
          nullable: true
          description: Exception class name
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                nullable: true
                description: Field causing the validation error
              message:
                type: string
                description: Error message for the specific field
          nullable: true
          description: Structured validation errors if applicable
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
      - status
      - message
      description: Standard error envelope returned on 4xx/5xx responses
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
          description: Current page number
        page_size:
          type: integer
          example: 20
          description: Items per page
        total_count:
          type: integer
          example: 142
          description: Total matching records
        total_pages:
          type: integer
          example: 8
          description: Total pages available
        has_next:
          type: boolean
          description: True when a later page exists
        has_prev:
          type: boolean
          description: True when an earlier page exists
      required:
      - page
      - page_size
      - total_count
      - total_pages
      - has_next
      - has_prev
      description: Pagination metadata block
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: oan_grievance_service
        api_version:
          type: string
          example: v1
      required:
      - status
      - service
      - api_version
      description: Service health status payload
    PingData:
      type: object
      properties:
        ping:
          type: string
          example: pong
        service:
          type: string
          example: oan_grievance_service
        api_version:
          type: string
          example: v1
      required:
      - ping
      - service
      - api_version
      description: Service ping payload
    SubmitterTypeItem:
      type: object
      properties:
        type_name:
          type: string
          example: Individual Farmer
        code:
          type: string
          example: IND_FARMER
        description:
          type: string
          nullable: true
      required:
      - type_name
    SubmissionTypeItem:
      type: object
      properties:
        type_name:
          type: string
          example: Mobile App
