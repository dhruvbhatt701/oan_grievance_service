  /api/v1/officers:
    get:
      tags:
      - Administration
      summary: List officers
      description: 'Admin list of officers (role Officer, the default) or Reviewers. level L3 lists the
        department heads, which the Admin tab shows. Filterable by level, department, status, service
        category and region. region matches the area and every area under it. position is a Position ID.
        q matches name or email. A Reviewer has no level, so level is refused for role Reviewer, and so
        is status On Leave. Listing Reviewers needs an admin role: a Review Officer reads Officer lists
        only.'
