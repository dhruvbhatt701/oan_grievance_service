      - BearerAuth: []
    post:
      tags:
      - Administration
      summary: Create an officer
      description: 'Make a login an officer or a Reviewer on the category desks of a department. role
        defaults to Officer. An Officer needs level (L1, L2 or L3) and service_categories; department
        and designation are optional. Without a department the officer sits on the category assignments
        that have no department. Level L3 makes a category admin, who may also leave out the service_categories
        (a last-resort desk for every case); a more specific head always wins over them. Only one category
        admin handles a category in a department, or a category with no department; a second is refused.
        A Reviewer needs service_categories and takes no level or reports_to: they read those desks''
        cases only, are never assigned one and cannot change one. For an L1, L2 or Reviewer every service
        category must already have a category assignment for the department (or with no department). For
        an L3 a missing category assignment is created with the head on it, and with create_department
        (default false) the department is created too, refused when it already exists. reports_to is an
        L2 officer and is only for an L1. The email must already have a login; an unknown email is a 404.
        The login keeps its own password and roles and is given the officer or review role; a System Manager
        or Administrator is never managed here.'
      operationId: post_api_v1_officers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerResponse'
