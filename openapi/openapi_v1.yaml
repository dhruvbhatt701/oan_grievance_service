  /api/v1/grievances/options:
    get:
      tags:
      - Grievances Core
      summary: Get grievance options and dropdowns
      description: "Management and lookup options for submitters, grievance officers and admins.\n\nReturns\
        \ reference lists for case filing, management, triage, and filtering,\nincluding departments,\
        \ lifecycle statuses, categories, and types. Departments and\ncategories are only those with a\
        \ desk that has an active officer.\nWhen `department` is provided, `service_categories` shrinks\
        \ to the categories that\ndepartment has an active category assignment for. When the caller is\
        \ also staff, it\ncascades and includes active officers under that department (optionally narrowed\
        \ by\n`service_category` and `administrative_area`). With only `service_category`, it lists the\n\
        officers on desks for that category. The caller is never listed. Submitters\nnever receive officers.\n\
        \nArgs:\n    service_category (str, optional): Filter grievance types & officers by service category\
        \ (e.g. 'Inputs').\n    category (str, optional): Alias for service_category.\n    department\
        \ (str, optional): Department ID. Limits service_categories to that department's\n        category\
        \ assignments and, for staff, fetches its assigned officers.\n    administrative_area (str, optional):\
        \ Administrative area to scope officer assignments.\n    ticket_number (str, optional): The case\
        \ being reassigned. Scopes officers to its region\n        and category and leaves out the category\
        \ admin.\n\nReturns:\n    departments: Departments with a staffed desk\n    statuses: Grievance\
        \ lifecycle statuses with metadata\n    service_categories: Active service categories with a staffed\
        \ desk (only the department's when `department` is given)\n    grievance_types: Active grievance\
        \ types (optionally filtered by service_category)\n    submission_channels: Active intake channels\n\
        \    officers: Active officers under the specified department and/or service category (staff only,\
        \ present only if either is passed)\n    can_change_category: With `ticket_number`, for staff:\
        \ whether the caller may move the case to\n        another category (administrators, and the fallback\
        \ desk triaging it)\n\nWith `ticket_number` the officers are the assignees that case can be reassigned\
        \ to: only\nofficers whose region covers the case's administrative area (the case's own area wins\
        \ over\n`administrative_area`), in the case's category unless another is named, and never the\n\
        category admin (the top rung), who is not an assignee for a reassignment. For an officer\nwho\
        \ is not an administrator they are only the officers in line for the caller\n(`reassignment.officer_move_limits`):\
        \ the next level up, which may be the category admin,\nand the officers below the caller on a\
        \ desk covering the case. Any other pick waits for\nthe receiving head's approval."
      operationId: get_api_v1_grievances_options
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrievanceOptionsResponse'
