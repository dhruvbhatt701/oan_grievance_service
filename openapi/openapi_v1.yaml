      - BearerAuth: []
    post:
      tags:
      - Administration
      summary: Create an SLA rule
      description: 'Add rules to a service category. service_category and sla_days are required; grievance_types
        (several allowed) makes one rule per type, all sharing the other fields, and none makes one rule
        for every type; is_urgent defaults to false (true makes the case Urgent, with priority Urgent).
