          type: string
          example: '+251911887766'
          nullable: true
        country_code:
          type: string
          example: '+251'
          nullable: true
        phone_number:
          type: string
          example: '911887766'
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
