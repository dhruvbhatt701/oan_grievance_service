  /api/v1/charts:
    get:
      tags:
      - Dashboard Charts
      summary: Dashboard charts (Grievance Admin, Grievance Officer)
      description: 'Several charts in one round trip, each built and cached on its own.


        An admin may ask for any chart. An officer gets the public (counts only) charts, narrowed

        to the cases inside their RBAC desks; an admin-only chart id is as unknown to them as a

        mistyped one. An officer on no usable desk reads zeros.


        A chart that fails comes back as `data[<id>] = null` with its error in

        `meta.errors`, so one broken tile does not blank the dashboard.'
      operationId: get_api_v1_charts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardChartsResponse'
        '400':
          description: Validation or Bad Input Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '401':
          description: Unauthorized / Authentication Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '403':
          description: Forbidden / Insufficient Role Scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      parameters:
      - name: charts
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated chart ids (at most 20); all charts when omitted
      - name: region
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated Region P-codes (e.g. ET04)
      - name: service_category
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated service category names; `category` is accepted as an alias
      - name: level
        in: query
        required: false
        schema:
          type: string
        description: 'Comma-separated administrative levels: federal, region, woreda (grvByAdminLevel).
          An officer is limited to their own level and the ones below it'
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Period start (trend, category-resolution and average-resolution charts)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Period end, default today
      - name: month
        in: query
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
        description: YYYY-MM for grvPerformanceKpis and grvPerformanceScore, default the current month
      - name: as_of_month
        in: query
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
        description: 'YYYY-MM for grvResolutionRateByRegion only: read it as at the end of that month
          instead of today. Not `month`, so a page can send `month` to every chart safely'
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          enum:
          - month
          - week
          default: month
        description: Period size for grvNetBacklogTrend
      - name: assigned_dept
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated department names
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        description: Rows for grvRecent
      x-legacy-rpc-method: oan_grievance_service.api.v1.charts.get_charts
      x-gateway-tier: officer-core
      security:
      - BearerAuth: []
