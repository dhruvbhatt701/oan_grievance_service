      - /v1/sla-policy
      - /v1/sla-policy/*
      - /v1/sla-rules
      - /v1/sla-rules/*
      - /v1/submitters
      - /v1/submitters/*
      methods:
      - OPTIONS
    plugins:
    - name: cors
      enable: true
      config:
        allow_origins: https://cors-by-regex-only.invalid
        allow_origins_by_regex:
{{- range .Values.corsOriginRegexes }}
        - {{ printf "^(?:%s)$" . | quote }}
{{- end }}
        allow_methods: GET,POST,PATCH,DELETE,OPTIONS
        allow_headers: Authorization,Content-Type,X-Request-Id,X-CSRF-Token
        allow_credential: false
        max_age: 3600
    - name: client-control
      enable: true
      config:
        max_body_size: 15728640
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
        - ^/(v[0-9]+)/(.*)
        - /api/$1/$2
{{- if .Values.web.externalHosts }}
    upstreams:
    - name: {{ required "web.serviceName is required" .Values.web.serviceName | quote }}
{{- else }}
    backends:
    - serviceName: {{ required "web.serviceName is required" .Values.web.serviceName | quote }}
      servicePort: {{ .Values.web.port }}
{{- end }}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: realtime-v1
  labels:
    app: oan-grievance
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  http:
  - name: realtime-socket-io-bearer
    priority: 10
    websocket: true
    match:
{{- if .Values.hosts }}
      hosts:
{{- range .Values.hosts }}
      - {{ . | quote }}
{{- end }}
{{- end }}
      paths:
      - /socket.io/
      - /socket.io/*
      exprs:
      - subject:
          scope: Variable
          name: http_authorization
        op: RegexMatch
        value: ^Bearer .+
    plugins:
    - name: limit-count
      enable: true
      config:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: {{ required "redis.host is required" .Values.redis.host | quote }}
        redis_port: 6379
        allow_degradation: true
    - name: proxy-rewrite
      enable: true
      config:
        host: {{ required "siteName is required" .Values.siteName | quote }}
        headers:
          set:
            Origin: http://{{ .Values.siteName }}:8000
            X-Frappe-Site-Name: {{ required "siteName is required" .Values.siteName | quote }}
          remove:
          - Cookie
{{- if .Values.socket.externalHosts }}
    upstreams:
    - name: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
{{- else }}
    backends:
    - serviceName: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
      servicePort: {{ .Values.socket.port }}
{{- end }}
  - name: realtime-socket-io-cookie-local
    priority: 0
    websocket: true
    match:
{{- if .Values.hosts }}
      hosts:
{{- range .Values.hosts }}
      - {{ . | quote }}
{{- end }}
{{- end }}
      paths:
      - /socket.io/
      - /socket.io/*
      exprs:
      - subject:
          scope: Variable
          name: http_origin
        op: In
        set:
{{- range .Values.realtimeAllowedOrigins }}
        - {{ . | quote }}
{{- end }}
      - subject:
          scope: Variable
          name: cookie_auth_token
        op: RegexMatch
        value: .+
      - subject:
          scope: Variable
          name: cookie_last_activity
        op: RegexMatch
        value: .+
    plugins:
    - name: limit-count
      enable: true
      config:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: {{ required "redis.host is required" .Values.redis.host | quote }}
        redis_port: 6379
        allow_degradation: true
    - name: proxy-rewrite
      enable: true
      config:
        host: {{ required "siteName is required" .Values.siteName | quote }}
        headers:
          set:
            Origin: http://{{ .Values.siteName }}:8000
            X-Frappe-Site-Name: {{ required "siteName is required" .Values.siteName | quote }}
            Authorization: Bearer $cookie_auth_token
          remove:
          - Cookie
{{- if .Values.socket.externalHosts }}
    upstreams:
    - name: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
{{- else }}
    backends:
    - serviceName: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
      servicePort: {{ .Values.socket.port }}
{{- end }}
  - name: realtime-socket-io-cookie-iam
    priority: 0
    websocket: true
    match:
{{- if .Values.hosts }}
      hosts:
{{- range .Values.hosts }}
      - {{ . | quote }}
{{- end }}
{{- end }}
      paths:
      - /socket.io/
      - /socket.io/*
      exprs:
      - subject:
          scope: Variable
          name: http_origin
        op: In
        set:
{{- range .Values.realtimeAllowedOrigins }}
        - {{ . | quote }}
{{- end }}
      - subject:
          scope: Variable
          name: cookie_X-Access-Token
        op: RegexMatch
        value: .+
      - subject:
          scope: Variable
          name: cookie_auth_token
        op: RegexNotMatch
        value: .+
    plugins:
    - name: limit-count
      enable: true
      config:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: {{ required "redis.host is required" .Values.redis.host | quote }}
        redis_port: 6379
        allow_degradation: true
    - name: proxy-rewrite
      enable: true
      config:
        host: {{ required "siteName is required" .Values.siteName | quote }}
        headers:
          set:
            Origin: http://{{ .Values.siteName }}:8000
            X-Frappe-Site-Name: {{ required "siteName is required" .Values.siteName | quote }}
            Authorization: Bearer ${cookie_X-Access-Token}
          remove:
          - Cookie
{{- if .Values.socket.externalHosts }}
    upstreams:
    - name: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
{{- else }}
    backends:
    - serviceName: {{ required "socket.serviceName is required" .Values.socket.serviceName | quote }}
      servicePort: {{ .Values.socket.port }}
{{- end }}
