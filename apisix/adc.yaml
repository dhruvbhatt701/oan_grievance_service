- name: oan-grievance-realtime-v1
  labels:
    app: oan-grievance
  upstream:
    scheme: http
    nodes:
    - host: ${OAN_GRIEVANCE_SOCKET_UPSTREAM_HOST}
      port: 9000
      weight: 1
    pass_host: pass
    timeout:
      connect: 5
      send: 3600
      read: 3600
    retries: 0
  routes:
  - name: oan-grievance-realtime-socket-io-bearer
    labels:
      app: oan-grievance
      tier: realtime
      auth: bearer
    uris:
    - /socket.io/
    - /socket.io/*
    vars:
    - - http_authorization
      - ~~
      - ^Bearer .+
    priority: 10
    enable_websocket: true
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: ${APISIX_REDIS_HOST}
        redis_port: 6379
        allow_degradation: true
      proxy-rewrite:
        host: ${FRAPPE_SITE_NAME}
        headers:
          set:
            Origin: http://${FRAPPE_SITE_NAME}:8000
            X-Frappe-Site-Name: ${FRAPPE_SITE_NAME}
          remove:
          - Cookie
  - name: oan-grievance-realtime-socket-io-cookie-local
    labels:
      app: oan-grievance
      tier: realtime
      auth: cookie
    uris:
    - /socket.io/
    - /socket.io/*
    vars:
    - - http_origin
      - in
      - - http://localhost:3000
    - - cookie_auth_token
      - ~~
      - .+
    - - cookie_last_activity
      - ~~
      - .+
    priority: 0
    enable_websocket: true
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: ${APISIX_REDIS_HOST}
        redis_port: 6379
        allow_degradation: true
      proxy-rewrite:
        host: ${FRAPPE_SITE_NAME}
        headers:
          set:
            Origin: http://${FRAPPE_SITE_NAME}:8000
            X-Frappe-Site-Name: ${FRAPPE_SITE_NAME}
            Authorization: Bearer $cookie_auth_token
          remove:
          - Cookie
  - name: oan-grievance-realtime-socket-io-cookie-iam
    labels:
      app: oan-grievance
      tier: realtime
      auth: cookie
    uris:
    - /socket.io/
    - /socket.io/*
    vars:
    - - http_origin
      - in
      - - http://localhost:3000
    - - cookie_X-Access-Token
      - ~~
      - .+
    - - cookie_auth_token
      - '!'
      - ~~
      - .+
    priority: 0
    enable_websocket: true
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        policy: redis
        redis_host: ${APISIX_REDIS_HOST}
        redis_port: 6379
        allow_degradation: true
      proxy-rewrite:
        host: ${FRAPPE_SITE_NAME}
        headers:
          set:
            Origin: http://${FRAPPE_SITE_NAME}:8000
            X-Frappe-Site-Name: ${FRAPPE_SITE_NAME}
            Authorization: Bearer ${cookie_X-Access-Token}
          remove:
          - Cookie
consumers:
- username: oan-ivr-vendor
  labels:
    app: oan-grievance
  plugins:
    key-auth:
      key: $env://OAN_IVR_VENDOR_KEY
